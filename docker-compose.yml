# Local development: `docker compose up -d` starts Postgres + Redis (+ app and worker).
# To run only infrastructure and use `pnpm dev` / `pnpm worker` on the host:
#   docker compose up -d postgres redis
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ai_lead
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_lead"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_lead
      REDIS_URL: redis://redis:6379
    command: sh -c "pnpm db:deploy && pnpm start"
    ports: ["3000:3000"]
    volumes: [previews:/app/storage/previews]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_lead
      REDIS_URL: redis://redis:6379
      APP_URL: http://app:3000
    command: ["pnpm", "worker"]
    volumes: [previews:/app/storage/previews]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  previews:
