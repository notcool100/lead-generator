# /etc/nginx/sites-available/lead-generator
# Dashboard + API
server {
  listen 443 ssl http2;
  server_name app.example.com;
  # ssl_certificate / ssl_certificate_key from certbot

  client_max_body_size 2m;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# Previews on wildcard subdomains (PREVIEW_BASE_DOMAIN=preview.example.com).
# Requires a wildcard DNS record and certificate for *.preview.example.com.
server {
  listen 443 ssl http2;
  server_name ~^(?<slug>[a-z0-9-]+)\.preview\.example\.com$;

  location / {
    proxy_pass http://127.0.0.1:3000;   # proxy.ts rewrites <slug>.<base> -> /p/<slug>
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
